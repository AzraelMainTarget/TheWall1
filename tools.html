<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010104">
<meta name="robots" content="noindex, nofollow">
<title>Tools — That Darkness</title>
<style>
  :root{--ink:#e8f1ff;--dim:#7d90ab;--line:rgba(150,190,255,.16);--accent:#cfe6ff;--ok:#7ee0a8;--bad:#ff9f96;}
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:radial-gradient(130% 90% at 50% 0%,#0a111d 0%,#010104 58%);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;}
  .wrap{max-width:620px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px max(30px,env(safe-area-inset-bottom));}
  h1{font-size:14px;font-weight:300;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);
     margin:8px 0 4px;text-shadow:0 0 34px rgba(150,200,255,.45);}
  .sub{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:0 0 26px;}

  /* gate */
  #gate{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:74vh;text-align:center;}
  #gate.hide{display:none;}
  #gate input{width:100%;max-width:320px;margin-top:18px;padding:15px;text-align:center;border-radius:14px;
    border:1px solid var(--line);background:rgba(8,14,26,.9);color:var(--ink);font-size:16px;outline:none;}
  #gate input:focus{border-color:rgba(200,230,255,.5);}
  #gateBtn{margin-top:14px;width:100%;max-width:320px;min-height:52px;border-radius:14px;border:none;
    background:linear-gradient(180deg,rgba(190,220,255,.96),rgba(140,180,240,.92));color:#06101f;
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;}
  #gateMsg{margin-top:14px;font-size:12px;min-height:16px;color:var(--bad);}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  @media(max-width:380px){.grid{grid-template-columns:1fr;}}
  a.tile,button.tile{
    display:flex;flex-direction:column;justify-content:space-between;gap:10px;
    min-height:104px;padding:16px;border-radius:16px;text-decoration:none;
    border:1px solid var(--line);background:rgba(10,17,29,.82);color:var(--ink);
    font-family:inherit;text-align:left;cursor:pointer;transition:border-color .2s,background .2s,transform .12s;
    -webkit-tap-highlight-color:transparent;
  }
  a.tile:hover,button.tile:hover{border-color:rgba(200,230,255,.45);background:rgba(16,26,42,.9);}
  a.tile:active,button.tile:active{transform:translateY(1px);}
  .t-ico{font-size:19px;opacity:.9;}
  .t-name{font-size:13px;letter-spacing:.04em;}
  .t-hint{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}

  section{margin-top:30px;}
  h2{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);font-weight:400;margin:0 0 12px;}
  .panel{border:1px solid var(--line);border-radius:16px;background:rgba(10,17,29,.7);padding:16px;}
  input.field,textarea.field{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);
    background:rgba(6,11,20,.92);color:var(--ink);font-size:14px;font-family:inherit;outline:none;}
  input.field:focus,textarea.field:focus{border-color:rgba(200,230,255,.5);}
  .row{display:flex;gap:9px;margin-top:10px;flex-wrap:wrap;}
  .btn{flex:1 1 110px;min-height:46px;border-radius:12px;border:1px solid var(--line);
    background:rgba(12,20,34,.9);color:var(--ink);font-family:inherit;font-size:12.5px;letter-spacing:.05em;cursor:pointer;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:linear-gradient(180deg,rgba(190,220,255,.96),rgba(140,180,240,.92));color:#06101f;
    border-color:transparent;font-weight:600;}
  pre.out{margin:12px 0 0;padding:12px;border-radius:12px;background:rgba(4,8,14,.95);border:1px solid var(--line);
    font-size:11.5px;line-height:1.55;color:#a9c2dd;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(150,190,255,.08);font-size:12.5px;}
  .kv:last-child{border-bottom:none;}
  .kv b{font-weight:500;color:#bed4ee;}
  .ok{color:var(--ok);} .bad{color:var(--bad);} .mut{color:var(--dim);}
  .lock{margin-top:26px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#485768;
    cursor:pointer;text-align:center;}
</style>
</head>
<body>
<div class="wrap">

  <div id="gate">
    <h1>Tools</h1>
    <p class="sub">Private</p>
    <input id="gatePass" type="password" placeholder="Access code" autocomplete="current-password">
    <button id="gateBtn">Enter</button>
    <div id="gateMsg"></div>
  </div>

  <div id="app" style="display:none">
    <h1>Tools</h1>
    <p class="sub">Одно место для всего</p>

    <div class="grid">
      <a class="tile" href="index.html">
        <span class="t-ico">◎</span>
        <span><span class="t-name">Сайт</span><br><span class="t-hint">That Darkness</span></span>
      </a>
      <a class="tile" href="voice.html">
        <span class="t-ico">●</span>
        <span><span class="t-name">Запись голоса</span><br><span class="t-hint">→ Arena</span></span>
      </a>
      <button class="tile" id="tPass">
        <span class="t-ico">⚿</span>
        <span><span class="t-name">Пароли</span><br><span class="t-hint">генератор + хеш</span></span>
      </button>
      <button class="tile" id="tHook">
        <span class="t-ico">⇢</span>
        <span><span class="t-name">Вебхук Make</span><br><span class="t-hint">проверка</span></span>
      </button>
    </div>

    <section>
      <h2>Статус</h2>
      <div class="panel" id="statusBox">
        <div class="kv"><span>Сайт</span><b id="stSite" class="mut">…</b></div>
        <div class="kv"><span>Последний деплой</span><b id="stDeploy" class="mut">…</b></div>
        <div class="kv"><span>Ветка</span><b id="stBranch" class="mut">…</b></div>
      </div>
      <div class="row"><button class="btn" id="refresh">Обновить</button></div>
    </section>

    <section id="secret" style="display:none"></section>

    <p class="lock" id="lock">заблокировать</p>
  </div>
</div>

<script src="tools.js"></script>
</body>
</html>
