<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>That Darkness</title>
<meta name="td-build" content="portal-box-3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Jost:wght@300;400&family=Monoton&family=Montserrat:wght@700;800;900&family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#081A23;--ink:#F0F0EA;--dim:#5FA69B;--red:#B8CEC6;--glow:rgba(20,123,120,.5);--serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost",system-ui,sans-serif;--ease:cubic-bezier(.22,.8,.24,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
canvas#c.drag{cursor:grabbing}
canvas#edge{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;mix-blend-mode:screen;opacity:.9}
#title{position:fixed;top:max(8px,env(safe-area-inset-top));left:50%;margin:0;z-index:2;pointer-events:none;
  transform:translateX(-50%);transform-origin:50% 40%;
  font:800 clamp(26px,5.55vw,78px)/1.08 "Baloo 2",system-ui,sans-serif;text-transform:uppercase;
  letter-spacing:.005em;white-space:nowrap;
  color:transparent;
  filter:drop-shadow(0 2px 0 rgba(184,206,198,.9))
         drop-shadow(0 8px 12px rgba(0,0,0,.5))
         drop-shadow(0 26px 34px rgba(0,0,0,.65))
         drop-shadow(0 0 44px rgba(20,123,120,.4))}
/* светлая боковая грань уходит вниз-вправо */
#title::before{content:attr(data-t);position:absolute;left:0;top:0;width:100%;z-index:-1;text-align:center;
  letter-spacing:.005em;color:transparent;
  text-shadow:
    0 0 1px rgba(6,20,26,.9),
    1px 1px 0 #E4EEE9,2px 2px 0 #D9E7E1,3px 3px 0 #CEDFD8,4px 4px 0 #C3D7CE,
    5px 5px 0 #B8CEC6,6px 6px 0 #ADC5BB,7px 7px 0 #A2BCB1,8px 8px 0 #97B3A7,
    10px 11px 10px rgba(0,0,0,.5),0 22px 26px rgba(0,0,0,.5)}
/* лицо: тёмная бирюза с зерном, поверх грани */
#title::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;z-index:0;text-align:center;
  letter-spacing:.005em;
  background-image:
    radial-gradient(rgba(240,240,234,.34) .5px,rgba(240,240,234,0) .9px),
    radial-gradient(rgba(4,14,18,.75) .5px,rgba(4,14,18,0) .9px),
    radial-gradient(130% 100% at 30% 0%,rgba(95,166,155,.30),rgba(95,166,155,0) 58%),
    linear-gradient(168deg,#0F6A66 0%,#0B4A51 42%,#073039 74%,#05161C 100%);
  background-size:2px 2px,2px 2px,100% 100%,100% 100%;
  background-position:0 0,1px 1px,0 0,0 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(240,240,234,.35)) drop-shadow(0 -1px 0 rgba(4,14,18,.95))}
@media (max-width:520px){
  #title{font-size:clamp(22px,7.2vw,42px);letter-spacing:0}
  #title::after{letter-spacing:0}
  #title::before{letter-spacing:0;text-shadow:
    0 0 1px rgba(6,20,26,.9),
    1px 1px 0 #E4EEE9,2px 2px 0 #D6E4DE,3px 3px 0 #C8D9D2,4px 4px 0 #BAD0C7,
    5px 5px 0 #ACC6BC,6px 6px 0 #9EBCB1,7px 7px 0 #90B2A6,9px 10px 8px rgba(0,0,0,.45),0 18px 20px rgba(0,0,0,.4)}}@media (max-width:520px){
  #hint{gap:3px;bottom:max(10px,env(safe-area-inset-bottom));left:0;right:0;opacity:.66}
  #hint .credit-line{font-size:8.2px;letter-spacing:.08em}
  #hint .credit-line:nth-child(2){font-size:7.4px;letter-spacing:.04em}
  #hint .credit-year{font-size:8.6px;letter-spacing:.3em}}
@media (prefers-reduced-motion:reduce){#icons button::before{opacity:.6}}
/* ---------- телепорт ---------- */
#tp{position:fixed;inset:0;z-index:80;pointer-events:none;opacity:0;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 50%,rgba(20,123,120,.0) 0%,rgba(4,14,18,.0) 42%,rgba(2,8,11,.92) 72%,#01060a 100%)}
#tp.run{opacity:1;pointer-events:auto}
/* портал-воронка */
#tp .funnel{position:relative;width:min(64vmin,420px);aspect-ratio:1;border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%,#F0F0EA 0%,#B8CEC6 6%,#5FA69B 14%,#147B78 26%,rgba(14,77,85,.55) 44%,rgba(8,26,35,.1) 62%,transparent 72%);
  filter:blur(1px);opacity:0;transform:scale(.25)}
#tp.run .funnel{animation:funnelIn .78s cubic-bezier(.4,0,.2,1) forwards}
@keyframes funnelIn{
  0%{opacity:0;transform:scale(.2) rotate(0deg)}
  35%{opacity:1;transform:scale(.72)}
  100%{opacity:1;transform:scale(1.5);filter:blur(6px)}
}
/* закручивающиеся лучи */
#tp .rays{position:absolute;inset:-25%;border-radius:50%;opacity:0;
  background:repeating-conic-gradient(from 0deg,rgba(240,240,234,.5) 0deg 2deg,transparent 2deg 13deg);
  mask-image:radial-gradient(circle,transparent 16%,#000 46%,transparent 72%);
  -webkit-mask-image:radial-gradient(circle,transparent 16%,#000 46%,transparent 72%)}
#tp.run .rays{animation:raysSpin 1.05s linear forwards}
@keyframes raysSpin{0%{opacity:0;transform:scale(.6) rotate(0)}30%{opacity:.75}100%{opacity:0;transform:scale(1.9) rotate(230deg)}}
/* вспышка в конце */
#tp .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#FFFFFF,#B8CEC6 22%,transparent 55%);
  opacity:0;mix-blend-mode:screen}
#tp.run .flash{animation:tpFlash .72s ease-out .56s forwards}
@keyframes tpFlash{0%{opacity:0;transform:scale(.3)}45%{opacity:.95}100%{opacity:0;transform:scale(1.7)}}
/* кольцо-разрыв */
#tp .ring{position:absolute;width:min(60vmin,380px);aspect-ratio:1;border-radius:50%;
  border:1.5px solid rgba(240,240,234,.8);opacity:0}
#tp.run .ring{animation:ringOut .8s ease-out .42s forwards}
@keyframes ringOut{0%{opacity:.9;transform:scale(.35)}100%{opacity:0;transform:scale(1.9)}}
/* надпись */
#tp .cap{position:absolute;left:0;right:0;bottom:17%;text-align:center;opacity:0;
  font:800 10px/1.5 "Montserrat",sans-serif;letter-spacing:.42em;text-transform:uppercase;color:#B8CEC6}
#tp.run .cap{animation:capIn .8s ease-out .2s forwards}
@keyframes capIn{0%{opacity:0;transform:translateY(8px)}35%{opacity:.85;transform:none}100%{opacity:0}}

/* карточку продукта «засасывает» */
.prod-card.sucking{animation:suck .72s cubic-bezier(.55,0,.85,.4) forwards;pointer-events:none}
@keyframes suck{
  0%{transform:scale(1) rotate(0);filter:blur(0);opacity:1}
  55%{transform:scale(.86) rotate(-4deg);filter:blur(1px);opacity:.9}
  100%{transform:scale(.05) rotate(-16deg);filter:blur(8px);opacity:0}
}
/* всё окно уходит в глубину */
body.tp-out .win:not(.prodwin){animation:winSuck .7s ease-in forwards}
@keyframes winSuck{to{transform:scale(.9);opacity:0;filter:blur(10px)}}
@supports not (-webkit-touch-callout:none){}
#hint{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;pointer-events:none;z-index:2;
  display:flex;flex-direction:column;gap:4px;padding:0 14px;opacity:.72}
#hint .credit-line{font:400 9.5px/1.35 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:#5FA69B}
#hint .credit-line:nth-child(2){font-size:8.5px;letter-spacing:.10em;color:#5FA69B}
#hint .credit-year{font:400 10px/1 var(--sans);letter-spacing:.38em;color:#8FB6AE;margin-top:1px}
#hint b{font-weight:700;color:#F0F0EA;letter-spacing:.2em;text-shadow:0 0 12px rgba(20,123,120,.75)}

/* access points: thin mint line icons that sit inside the portal openings */
#icons button{--blur:0;position:fixed;left:0;top:0;width:var(--b,78px);height:var(--b,78px);margin:calc(var(--b,78px)/-2) 0 0 calc(var(--b,78px)/-2);padding:0;
  border:1px solid rgba(95,166,155,.22);border-radius:30%;
  background:
    radial-gradient(circle at var(--sx,32%) var(--sy,24%),rgba(214,255,240,.34),rgba(120,220,180,.10) 30%,rgba(0,0,0,0) 58%),
    radial-gradient(circle at 50% 78%,rgba(2,12,9,.92),rgba(4,16,12,.62) 62%,rgba(0,0,0,0) 88%),
    radial-gradient(circle at 50% 42%,rgba(95,166,155,.26),rgba(8,26,35,.62) 72%,rgba(0,0,0,0));
  color:#a9e2c9;cursor:pointer;z-index:3;opacity:0;pointer-events:none;will-change:transform,opacity;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 1px rgba(226,255,242,.28),inset 0 -10px 22px rgba(0,0,0,.62),inset 0 8px 18px rgba(4,20,14,.5),
             0 10px 26px rgba(0,0,0,.55),0 0 30px rgba(20,123,120,.2);
  transition:border-color .4s var(--ease),box-shadow .4s var(--ease),color .4s;transform-style:preserve-3d}
#icons button::before{content:"";position:absolute;inset:6%;border-radius:30%;pointer-events:none;
  background:radial-gradient(circle at var(--sx,32%) var(--sy,24%),rgba(236,255,248,.42),rgba(180,245,215,.12) 22%,rgba(0,0,0,0) 46%);
  mix-blend-mode:screen}
#icons button::after{content:"";position:absolute;inset:-6px;border-radius:34%;
  border:1px solid rgba(184,206,198,calc(.10 + var(--blur,0)*.18));
  box-shadow:0 0 16px rgba(95,166,155,calc(.06 + var(--blur,0)*.16));
  filter:blur(calc(var(--blur,0)*2.6px));opacity:calc(.35 + var(--blur,0)*.65);
  transition:opacity .55s var(--ease);animation:spin 22s linear infinite;animation-play-state:paused}
#icons button.on{pointer-events:auto}
#icons svg{width:46%;height:46%;transition:transform .45s var(--ease),filter .3s var(--ease),stroke-width .3s;stroke:currentColor;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.9)) drop-shadow(0 0 7px rgba(20,123,120,.95)) drop-shadow(0 -1px 3px rgba(184,206,198,.45));
  transform:translateZ(1px)}
/* нажатие/наведение: иконка вспыхивает ярче, ореол вокруг остаётся мягким */
#icons button.on:hover svg,#icons button:focus-visible svg,#icons button:active svg{
  stroke-width:1.6;color:#ffffff;
  filter:drop-shadow(0 0 3px rgba(255,255,255,.95)) drop-shadow(0 0 11px rgba(184,206,198,1))
         drop-shadow(0 0 24px rgba(20,123,120,.95)) drop-shadow(0 -1px 4px rgba(240,240,234,.7))}
/* подписи: ровно над кнопкой, все одной ширины */
#icons span{font:800 12.5px/1.05 "Montserrat","Jost",system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;text-indent:.16em;
  position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);
  width:118px;text-align:center;pointer-events:none;padding:0;
  /* объём в буквах: белая грань сверху, зелёный металл снизу, тёмная подложка-тень */
  color:#F0F0EA;
  text-shadow:0 -1px 0 rgba(255,255,255,.9),0 1px 0 #081A23,0 2px 0 #061319,0 3px 3px rgba(0,0,0,.9),
              0 0 2px rgba(6,20,26,.95),0 0 12px rgba(95,166,155,.85),0 0 26px rgba(20,123,120,.55);
  text-shadow:0 0 1px rgba(0,0,0,1),0 0 2px rgba(0,0,0,1),0 1px 0 rgba(0,0,0,.95),0 2px 3px rgba(0,0,0,.9),
              0 0 12px rgba(184,206,198,.95),0 0 26px rgba(20,123,120,.65);
  transition:color .3s var(--ease),letter-spacing .5s var(--ease),text-shadow .3s}
#icons button{color:#B8CEC6}
#icons button.on{color:#5FA69B}
#icons button:hover,#icons button:focus-visible{color:#F0F0EA}
#icons button:hover span,#icons button:focus-visible span{
  color:#ffffff;
  text-shadow:0 -1px 0 #ffffff,0 1px 0 #081A23,0 2px 0 #061319,0 3px 4px rgba(0,0,0,.95),
              0 0 3px rgba(6,20,26,1),0 0 14px rgba(184,206,198,1),0 0 32px rgba(20,123,120,.9)}
#icons span b{font-weight:800}
@media (max-width:560px){#icons span{font-size:10.5px;letter-spacing:.1em;width:100px;text-indent:.1em}}
#icons button.on:hover,#icons button:focus-visible{border-color:rgba(184,206,198,.62);color:#fff;box-shadow:0 0 30px rgba(20,123,120,.55),inset 0 0 22px rgba(95,166,155,.26);outline:0}
#icons button.on:hover::after,#icons button:focus-visible::after{opacity:1;animation-play-state:running}
#icons button.on:hover svg,#icons button:focus-visible svg{transform:scale(1.14)}
#icons button.on:hover span{color:#fff;letter-spacing:.18em}
@keyframes spin{to{transform:rotate(360deg)}}

.win{position:fixed;width:min(90vw,368px);max-height:62vh;max-height:min(62dvh,560px);display:flex;flex-direction:column;
  background:
    radial-gradient(130% 90% at 14% 0%,rgba(184,206,198,.22),rgba(184,206,198,0) 62%),
    radial-gradient(100% 80% at 96% 100%,rgba(20,123,120,.30),rgba(20,123,120,0) 64%),
    linear-gradient(168deg,rgba(14,77,85,.52),rgba(8,26,35,.62) 56%,rgba(6,20,26,.72));
  -webkit-backdrop-filter:blur(24px) saturate(1.25);backdrop-filter:blur(24px) saturate(1.25);
  border:1px solid rgba(184,206,198,.34);border-radius:21px;
  box-shadow:0 0 0 1px rgba(240,240,234,.06),
             0 0 24px rgba(240,240,234,.14),0 0 80px rgba(20,123,120,.28),0 26px 70px rgba(0,0,0,.6),
             inset 0 1px 0 rgba(240,240,234,.26),inset 0 0 46px rgba(95,166,155,.14);
  overflow:hidden;z-index:5;opacity:0;transform:scale(.94) translateY(14px);
  transition:opacity .38s var(--ease),transform .38s var(--ease),box-shadow .3s;
  will-change:transform,opacity;touch-action:none}
.win.open{opacity:1;transform:scale(1) translateY(0)}
.win.drag{transition:none;box-shadow:0 0 26px rgba(240,240,234,.22),0 0 90px rgba(20,123,120,.4),0 30px 90px rgba(0,0,0,.7)}
.win.snap{transition:left .34s var(--ease),top .34s var(--ease),opacity .38s var(--ease),transform .38s var(--ease),box-shadow .3s}
.win-bar{display:flex;align-items:center;gap:10px;padding:12px 12px 10px 14px;cursor:grab;
  background:linear-gradient(100deg,#0E4D55 0%,#147B78 52%,#5FA69B 100%);
  box-shadow:inset 0 1px 0 rgba(240,240,234,.4),0 6px 18px rgba(4,14,18,.45);
  border-bottom:1px solid rgba(236,206,255,.16);flex:0 0 auto;user-select:none;touch-action:none;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0))}
.win-bar:active{cursor:grabbing}
.win-grip{width:26px;height:4px;border-radius:2px;background:linear-gradient(90deg,rgba(240,240,234,.85),rgba(240,240,234,.2));flex:0 0 auto}
.win-btn{width:26px;height:26px;border-radius:34%;flex:0 0 auto;display:grid;place-items:center;
  border:1px solid rgba(236,206,255,.22);background:rgba(255,255,255,.09);
  color:#f0e4ff;font-size:15px;line-height:1;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.win-btn:hover{background:rgba(240,240,234,.22);border-color:rgba(184,206,198,.5);transform:scale(1.06)}
.win-btn:active{transform:scale(.94)}
.win-btn[data-close]:hover{background:rgba(184,206,198,.28);border-color:rgba(240,240,234,.6);color:#081A23}
/* свёрнутое окно: остаётся только шапка */
.win.min{max-height:none}
.win.min .win-body{display:none}
.win.min .win-bar{border-bottom:none}
.win.min .win-grip{background:linear-gradient(90deg,rgba(240,240,234,.9),rgba(240,240,234,.25))}
.win-title{font:500 14.5px/1.2 "Jost",system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;margin:0 auto 0 2px;color:#F0F0EA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-body{overflow-y:auto;padding:15px 17px 18px;font:400 14.5px/1.62 "Jost",system-ui,sans-serif;color:#E4EFEC;
  -webkit-overflow-scrolling:touch}
.win-body h2{margin:0 0 8px;font:500 14px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#F0F0EA}
.win-body p{margin:0 0 11px;max-width:60ch;color:#D9E7E3}
.win-body li{color:#DCEBE7}
.win-body ul{margin:0;padding:0;list-style:none}
.win-body li{padding:8px 0;border-top:1px solid rgba(236,206,255,.16);font:300 13px var(--sans)}
.win-body li.prod{border-top:none;padding:2px 0 10px}
.prod-card{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:18px;cursor:pointer;
  background:linear-gradient(168deg,rgba(184,206,198,.24),rgba(8,26,35,.6));
  border:1px solid rgba(184,206,198,.36);
  box-shadow:inset 0 1px 0 rgba(240,240,234,.24),0 10px 26px rgba(0,0,0,.35);
  transition:transform .18s ease,box-shadow .24s ease,border-color .24s ease}
.prod-card:hover{border-color:rgba(240,240,234,.55);box-shadow:inset 0 1px 0 rgba(240,240,234,.3),0 14px 32px rgba(0,0,0,.45)}
.prod-card:active{transform:scale(.985)}
.prod-card.dead{opacity:.62;cursor:default}
.prod-card.dead:hover{border-color:rgba(240,240,234,.3)}
.prod-txt{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.prod-by{font:700 9px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:#5FA69B;font-style:normal;opacity:.9}
.prod-txt small{color:#93A6AD;font-size:11.5px;line-height:1.45}
.prod-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.prod-tags u{text-decoration:none;font:800 8.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#B8CEC6;
  padding:4px 7px;border-radius:7px;background:rgba(20,123,120,.16);border:1px solid rgba(95,166,155,.3)}
.contact li b{color:#F0F0EA}
.gate-line{margin-top:12px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#5FA69B;opacity:.85}
.prod-ico{width:46px;height:46px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(160deg,#EAF3EF,#9FC7BC 62%,#5FA69B);
  box-shadow:0 6px 0 -2px #4E8C84,0 10px 20px rgba(0,0,0,.4)}
.prod-ico svg{width:32px;height:32px}
.prod-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.prod-txt b{font:800 14.5px/1.2 "Montserrat",sans-serif;letter-spacing:.04em;color:#F0F0EA}
.prod-txt small{font-size:11px;color:#9FC0B8;letter-spacing:.02em}
.prod-go{margin-left:auto;font:800 9.5px/1 inherit;letter-spacing:.16em;text-transform:uppercase;color:#5FA69B;
  white-space:nowrap}
.win-body li small{display:block;color:#bda6d2;margin-top:3px;font-size:12.5px}

/* замок на разделе */
.win-lock{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 6px 8px}
.win-lock .ico{font-size:26px;opacity:.75}
.win-lock input{width:100%;padding:12px 14px;border-radius:13px;text-align:center;font-size:15px;
  border:1px solid rgba(184,206,198,.36);background:rgba(240,240,234,.12);color:#F0F0EA;outline:none;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  font-family:inherit;letter-spacing:.06em}
.win-lock input:focus{border-color:rgba(160,230,200,.6);box-shadow:0 0 0 3px rgba(120,200,165,.12)}
.win-lock button{width:100%;padding:12px;border-radius:13px;border:none;cursor:pointer;
  background:linear-gradient(180deg,#F0F0EA,#B8CEC6);color:#081A23;font-family:inherit;
  font-size:13px;font-weight:600;letter-spacing:.06em}
.win-lock .msg{font-size:11.5px;color:#ff9f96;min-height:14px;letter-spacing:.04em}
.win-lock .hint{font-size:10px;color:#6d8579;letter-spacing:.1em;text-transform:uppercase}
#panel h2{margin:0 0 10px;font:300 24px/1.1 var(--serif);letter-spacing:.08em}
#panel p{margin:0 0 8px;font:300 15px/1.5 var(--serif);color:#d9c9bb;max-width:60ch}
#panel ul{margin:0;padding:0;list-style:none}
#panel li{padding:8px 0;border-top:1px solid rgba(95,166,155,.28);font:300 13px var(--sans);color:var(--ink)}
#panel li small{display:block;color:var(--dim);margin-top:2px}
#pb.a p,#pb.a li{animation:rise .6s var(--ease) both}

function teleport(target){

  if(!tp || tp.classList.contains('run')) return;
  tp.classList.add('run');
  document.body.classList.add('tp-out');

    teleport('desk.html');

    teleport('ragnell.html');

const disc=new THREE.Mesh(new THREE.CircleGeometry(R*1.06,96),new THREE.ShaderMaterial({uniforms:RU,transparent:true,depthWrite:false,depthTest:false,
vertexShader:`uniform float uR;varying vec2 vP;void main(){vP=position.xy/uR;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
fragmentShader:`uniform float uTime,uOpen,uHr;uniform vec2 uH[${NH}];varying vec2 vP;
${HOLEFN}
void main(){float r=length(vP);float ho=smoothstep(.1,.9,uOpen);float m=0.;
 for(int k=0;k<${NH};k++){vec2 d=vP-uH[k];float hr=holeR(d,float(k))*ho;m=max(m,1.-smoothstep(hr-.02,hr+.01,length(d)));}
 float edge=1.-smoothstep(.98,1.04,r);
 gl_FragColor=vec4(0.,0.,0.,.46*edge*(1.-.85*m*ho));}`}));
disc.renderOrder=.5;
/* гранёная стеклянная оболочка: даёт объём, контуры-«линзы» и блики по рёбрам */
const shell=new THREE.Mesh(new THREE.SphereGeometry(R*1.004,mobile?44:72,mobile?32:48),new THREE.ShaderMaterial({
 material_dummy:0,uniforms:{uTime:U.uTime,uCol:PU.uCol},transparent:true,depthWrite:false,depthTest:false,
 side:THREE.FrontSide,blending:THREE.AdditiveBlending,
 vertexShader:`varying vec3 vN;varying vec3 vV;varying vec3 vP;
void main(){vec4 wp=modelMatrix*vec4(position,1.);vN=normalize(mat3(modelMatrix)*normal);vV=normalize(cameraPosition-wp.xyz);vP=position;
 gl_Position=projectionMatrix*viewMatrix*wp;}`,
 fragmentShader:`uniform vec3 uCol;uniform float uTime;varying vec3 vN;varying vec3 vV;varying vec3 vP;
void main(){float f=abs(dot(normalize(vN),normalize(vV)));float fr=pow(1.-f,2.4);
 float spec=pow(f,18.);                                    // блик там, где нормаль смотрит в камеру
 float glint=.5+.5*sin(uTime*.6+vP.y*1.6);                 // медленно плывущий проблеск по рёбрам
 float e=fr*.40+.028+spec*.12*glint;
 gl_FragColor=vec4(uCol*e,min(.9,e*1.25));}`}));
shell.renderOrder=.62;shell.frustumCulled=false;
const group=new THREE.Group();group.add(disc,rim,shell,dust);scene.add(group);
BU.uPcol=PU.uCol;
const MN=mobile?260:520,mg=new THREE.BufferGeometry(),mpos=new Float32Array(MN*3),mrn=new Float32Array(MN);
for(let i=0;i<MN;i++){mpos[i*3]=(Math.random()-.5)*22;mpos[i*3+1]=(Math.random()-.5)*14;mpos[i*3+2]=-5+Math.random()*9;mrn[i]=Math.random()}
mg.setAttribute('position',new THREE.BufferAttribute(mpos,3));mg.setAttribute('aR',new THREE.BufferAttribute(mrn,1));
const motes=new THREE.Points(mg,new THREE.ShaderMaterial({uniforms:{uTime:U.uTime,uPix:U.uPix,uCol:PU.uCol},transparent:true,depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending,
vertexShader:`attribute float aR;uniform float uTime,uPix;varying float vA,vL;
void main(){vec3 p=position;
 float g=pow(.5+.5*sin(uTime*.31),3.);
 p.x=mod(p.x+uTime*(.05+.12*aR)+g*1.2*(.5+aR)+11.,22.)-11.;      // drifts with the breeze
 p.y+=sin(uTime*.4+aR*40.)*.35+sin(uTime*.17+aR*9.)*.5;
 p.z+=sin(uTime*.23+aR*21.)*.4;
 vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;
 gl_PointSize=uPix*(1.2+2.2*aR)*clamp(9./max(-mv.z,1.),.5,1.6);
 vL=exp(-length(p.xy)/4.5);
 vA=(.1+.16*aR)*(.55+.45*sin(uTime*(.8+aR*2.)+aR*70.))*(.6+.8*vL)*smoothstep(11.,8.,abs(p.x));
}`,
fragmentShader:`uniform vec3 uCol;varying float vA,vL;void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;gl_FragColor=vec4(mix(vec3(.6,.68,.72),uCol*1.5,vL),vA*smoothstep(.5,0.,d));}`}));
motes.frustumCulled=false;motes.renderOrder=2;scene.add(motes);
/* ---- сетка сферы: меридианы и параллели, которые видны только с лицевой стороны ---- */
const arcScene=new THREE.Group(),arcMat=[],arcBase=[];
{
  const VS=`attribute float aA;varying float vA;varying vec3 vN;varying vec3 vV;
void main(){vec4 wp=modelMatrix*vec4(position,1.);vN=normalize(mat3(modelMatrix)*normalize(position));
 vV=normalize(cameraPosition-wp.xyz);vA=aA;gl_Position=projectionMatrix*viewMatrix*wp;}`;
  const FS=`uniform vec3 uCol;uniform float uOp;varying float vA;varying vec3 vN;varying vec3 vV;
void main(){float face=smoothstep(-.15,.75,dot(normalize(vN),normalize(vV)));   // задняя половина гаснет
 float f=pow(1.-abs(dot(normalize(vN),normalize(vV))),1.6);
 gl_FragColor=vec4(uCol*(.5+.9*f)*uOp*(.25+.75*face),uOp*vA*face*(.35+.65*f));}`;
  const N=72,AR=1.008;
  const addLine=(pts,op)=>{
    const pos=new Float32Array(pts.length*3),aa=new Float32Array(pts.length);
    pts.forEach((p,i)=>{pos[i*3]=p[0];pos[i*3+1]=p[1];pos[i*3+2]=p[2];aa[i]=p[3]});
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(pos,3));
    g.setAttribute('aA',new THREE.BufferAttribute(aa,1));
    const m=new THREE.ShaderMaterial({uniforms:{uCol:{value:new THREE.Color(.26,.78,.58)},uOp:{value:op},uTime:U.uTime},
      vertexShader:VS,fragmentShader:FS,transparent:true,depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending});
    const ln=new THREE.Line(g,m);ln.frustumCulled=false;ln.renderOrder=1.4;arcScene.add(ln);
    arcMat.push(m);arcBase.push({ph:Math.random()*6.283,sp:.12+Math.random()*.22,base:op});
  };
  /* меридианы: сходятся у полюсов, поэтому не вырождаются в прямые */
  const NM=mobile?6:9;
  for(let i=0;i<NM;i++){
    const v=i/NM*Math.PI,pts=[];
    for(let j=0;j<=N;j++){const u=j/N*Math.PI*2;
      const x=Math.sin(u)*Math.cos(v), y=Math.cos(u), z=Math.sin(u)*Math.sin(v);
      const rr=AR*(1+.05*Math.sin(u*3+i));
      pts.push([x*rr*R,y*rr*R,z*rr*R, .35+.65*Math.pow(Math.sin(j/N*Math.PI),.7)])}
    addLine(pts,.11);
  }
  /* параллели */
  for(const lat of [-.62,-.3,.3,.62]){
    const pts=[],cy=Math.sin(lat),cr=Math.cos(lat);
    for(let j=0;j<=N;j++){const u=j/N*Math.PI*2;
      pts.push([Math.cos(u)*cr*AR*R, cy*AR*R, Math.sin(u)*cr*AR*R, .5+.5*Math.cos(u)])}
    addLine(pts,.085);
  }
}
scene.add(arcScene);

/* ---------- INPUT: tap opens/closes, pointer tilts and disturbs the dust ---------- */
let openV=0,openA=0,openT=0,reach=0,reachT=0,tX=0,tY=0,tiltX=0,tiltY=0,taT=0,ta=0,sx=0,sy=0;
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,0,1),0),hitV=new THREE.Vector3();
function toPortal(e){ndc.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(ndc,camera);
 if(!ray.ray.intersectPlane(plane,hitV))return null;return group.worldToLocal(hitV.clone()).divideScalar(R)}
function screenToPortal(x,y){ndc.set(x/innerWidth*2-1,-y/innerHeight*2+1);ray.setFromCamera(ndc,camera);
 if(!ray.ray.intersectPlane(plane,hitV))return null;return group.worldToLocal(hitV.clone()).divideScalar(R)}
function track(e,press){const p=toPortal(e),inside=!!p&&p.length()<1.15;
 if(p)PU.uPt.value.set(p.x,p.y);reachT=inside?1:0;taT=(inside&&(press||e.pointerType==='mouse'))?1:0;
 if(e.pointerType==='mouse'||press){tX=-(e.clientY/innerHeight-.5)*.35;tY=(e.clientX/innerWidth-.5)*.35}}
canvas.addEventListener('pointermove',e=>track(e,e.buttons>0));
canvas.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;track(e,true)});
canvas.addEventListener('pointerup',e=>{const moved=Math.hypot(e.clientX-sx,e.clientY-sy);taT=0;
 if(e.pointerType!=='mouse'){reachT=0;tX=tY=0}
 if(moved<10){const p=toPortal(e),inside=!!p&&p.length()<1.1;
  if(inside)openT=openT?0:1;else if(openT)openT=0}});
/* подсказка видна только когда портал закрыт и ничего не открыто */
function syncHint(){ /* подпись внизу постоянная */ }
canvas.addEventListener('pointerleave',e=>{if(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('#icons'))return;reachT=0;taT=0;tX=tY=0});

/* ---------- EDGE: тонкие лучи от поверхности сферы к открытым окнам ---------- */
const ecv=$('edge'),ECTX=ecv.getContext('2d');
function drawEdge(t,cx,cy){
  const kids=Object.keys(openWins).map(k=>openWins[k]);
  ECTX.clearRect(0,0,innerWidth,innerHeight);
  const rr=Math.min(innerWidth,innerHeight)*(innerWidth<innerHeight?.30:.22);
  /* раздел выходит из поверхности: короткий след от КРАЯ сферы к иконке, не через центр */
  for(let i=0;i<NH;i++){
    const g=ip[i]; if(g<.02||g>.985)continue;
    const b=btns[i]; if(!b||!b.style.transform)continue;
    const m=/translate3d\(([-\d.]+)px,([-\d.]+)px/.exec(b.style.transform); if(!m)continue;
    const ix=+m[1], iy=+m[2];
    const dx=ix-cx, dy=iy-cy, len=Math.hypot(dx,dy)||1;
    const ax=cx+dx/len*rr*.92, ay=cy+dy/len*rr*.92;      // старт у самого края
    const fade=Math.sin(Math.PI*Math.min(1,g))*.9;
    const gr=ECTX.createLinearGradient(ax,ay,ix,iy);
    gr.addColorStop(0,'rgba(210,255,240,0)');
    gr.addColorStop(.4,'rgba(160,250,220,'+(.34*fade)+')');
    gr.addColorStop(1,'rgba(235,255,248,'+(.85*fade)+')');
    ECTX.strokeStyle=gr;ECTX.lineWidth=1.5;
    ECTX.beginPath();ECTX.moveTo(ax,ay);ECTX.lineTo(ix,iy);ECTX.stroke();
  }
  if(!kids.length)return;
  kids.forEach((w,i)=>{
    const r=w.getBoundingClientRect();
    const tx=Math.max(r.left,Math.min(r.right,cx)), ty=Math.max(r.top,Math.min(r.bottom,cy));
    const dx=tx-cx, dy=ty-cy, len=Math.hypot(dx,dy)||1;
    const ax=cx+dx/len*rr, ay=cy+dy/len*rr;
    const ease=openV>.2?1:0;
    const g=ECTX.createLinearGradient(ax,ay,tx,ty);
    g.addColorStop(0,'rgba(120,235,195,0)');
    g.addColorStop(.30,'rgba(120,235,195,'+(.10*ease)+')');
    g.addColorStop(.75,'rgba(150,245,215,'+(.20*ease)+')');
    g.addColorStop(1,'rgba(210,255,240,'+(.42*ease)+')');
    ECTX.strokeStyle=g;ECTX.lineWidth=1.1;
    const mx=(ax+tx)/2+Math.sin(t*.7+i)*14, my=(ay+ty)/2+Math.cos(t*.6+i)*14;
    ECTX.beginPath();ECTX.moveTo(ax,ay);ECTX.quadraticCurveTo(mx,my,tx,ty);ECTX.stroke();
    ECTX.fillStyle='rgba(190,255,235,'+(.6*ease)+')';
    ECTX.beginPath();ECTX.arc(tx,ty,1.8,0,6.283);ECTX.fill();
  });
}

let camBase=15,rsz=0;
function resize(){camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<innerHeight?72:55;camera.updateProjectionMatrix();
 const cap=mobile?1.6:2;prCur=Math.min(cap,Math.max(1,prCur||cap));renderer.setPixelRatio(prCur);
 const edpr=Math.min(devicePixelRatio,2);
 ecv.width=Math.round(innerWidth*edpr);ecv.height=Math.round(innerHeight*edpr);
 ECTX.setTransform(ecv.width/innerWidth,0,0,ecv.height/innerHeight,0,0);
 refitWins();edgeDirty=true;
 camBase=R/(.8*Math.tan(camera.fov*Math.PI/360)*Math.min(1,camera.aspect));
 renderer.setSize(innerWidth,innerHeight);U.uPix.value=renderer.getPixelRatio();sizeBg();BU.uHor.value=innerWidth<innerHeight?.31:.33}
addEventListener('resize',()=>{cancelAnimationFrame(rsz);rsz=requestAnimationFrame(resize)});
addEventListener('orientationchange',()=>{cancelAnimationFrame(rsz);rsz=requestAnimationFrame(()=>{resize();setTimeout(resize,350)})});
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{cancelAnimationFrame(rsz);rsz=requestAnimationFrame(resize)});
resize();

let fa=.016,fc=0,lastB=0;const clock=new THREE.Clock(),v=new THREE.Vector3(),lerp=(a,b,t)=>a+(b-a)*t,c01=x=>x<0?0:x>1?1:x;
const btnV=btns.map(()=>-1),btnOn=btns.map(()=>false),tw=btns.map(()=>0),ip=btns.map(()=>0),titleEl=$('title');
function loop(){
  const dt=Math.min(clock.getDelta(),.05),ts=dt*TS,T=(U.uTime.value+=ts);BU.uTime.value+=ts*2.4;
  /* adaptive resolution of the water: keeps the frame rate steady on any device */
  fa=fa*.97+dt*.03;if(++fc%60===0){
    if(fa>.030&&bgS>BG_MIN){bgS=Math.max(BG_MIN,bgS-.04);sizeBg()}
    else if(fa<.0225&&bgS<BG_MAX){bgS=Math.min(BG_MAX,bgS+.02);sizeBg()}}
  /* two chained easings = an S-curve: the portal opens and closes softly, no hard start or stop */
  PU.uPulse.value=Math.max(0,PU.uPulse.value-dt*.75);
  dragFade+=((0)-dragFade)*Math.min(1,dt*6);
  PU.uDrag.value.z=Math.max(0,PU.uDrag.value.z-dt*2.2);
  const k1=1-Math.pow(.0009,dt),k2=1-Math.pow(.035,dt);
  openA=lerp(openA,openT,k1);openV=lerp(openV,openA,k1);PU.uOpen.value=openV;
  reach=lerp(reach,hoverI>=0?1:reachT,1-Math.pow(.003,dt));
  const gs=1+.05*openV+.006*Math.sin(T*.9);                    // slight swell on open + a faint breath
  group.scale.setScalar(gs);
  const camDist=camBase*1.14*(1-.03*reach);        /* сфера чуть дальше: не задевает воду */
  camera.position.set(0,0,camDist);camera.updateMatrixWorld();
  group.position.y=camDist*0.06;arcScene.position.y=group.position.y;
  group.scale.multiplyScalar(1);
  tiltX=lerp(tiltX,tX,k2);tiltY=lerp(tiltY,tY,k2);
  group.rotation.set(tiltX+Math.sin(T*.31)*.016,tiltY+Math.cos(T*.23)*.02,Math.sin(T*.11)*.012);
  group.updateMatrixWorld(true);
  ta=lerp(ta,taT,1-Math.pow(.001,dt));PU.uTa.value=ta;
  const pr=renderer.getPixelRatio(),pxD=2*R*gs/(camera.position.z*Math.tan(camera.fov*Math.PI/360))*(innerHeight/2);   // portal diameter in CSS px
  PU.uSz.value=Math.max(1.1*pr,pxD*pr/400*1.2);
  BU.uPr.value=pxD*.5/innerHeight;BU.uPI.value=(.85+.2*openV)*(1+.06*Math.sin(T*2.3)+.04*Math.sin(T*5.1));
  const bpx=Math.round(Math.max(44,HR*pxD*.72));if(bpx!==lastB){lastB=bpx;iconBox.style.setProperty('--b',bpx+'px')}
  const ringR=pxD*.5*1.0;                                  /* радиус обода в CSS px */
  iconBox.style.setProperty('--ring',Math.round(ringR)+'px');
  iconBox.style.setProperty('--bb',Math.round(bpx)+'px');
  /* icons rise out of the portal centre into their openings: staggered, fast-out slow-in */
  const want=openT&&openV>.3;
  v.set(0,0,0).applyMatrix4(group.matrixWorld).project(camera);
  const cx=(v.x*.5+.5)*innerWidth,cy=(-v.y*.5+.5)*innerHeight;
  for(let i=0;i<NH;i++){
    if(want){tw[i]+=dt;ip[i]=Math.max(ip[i],c01((tw[i]-i*.012)/.38))}else{tw[i]=0;ip[i]=Math.max(0,ip[i]-dt/.22)}
    const b=btns[i],g=ip[i];
    if(g<.002){if(btnV[i]!==0){b.style.opacity=0;btnV[i]=0}if(btnOn[i]){b.classList.remove('on');btnOn[i]=false}continue}
    v.set(holes[i].x*R,holes[i].y*R,0).applyMatrix4(group.matrixWorld).project(camera);
    const e=g*g*(3-2*g),s=1-Math.pow(1-g,3);
    const x=lerp(cx,(v.x*.5+.5)*innerWidth,s),y=lerp(cy,(-v.y*.5+.5)*innerHeight,s)+Math.sin(T*1.1+i*1.7)*1.6*e;
    /* подпись выезжает над кнопкой: мягко, на той же волне, что и сама кнопка */
    const lab=b.querySelector('span');
    if(lab){
      const rise=Math.round((1-e)*10*10)/10;
      const op=Math.round(Math.max(0,Math.min(1,(g-.1)/.55))*40)/40;
      if(lab._r!==rise){lab._r=rise;lab.style.transform=`translateX(-50%) translateY(${rise}px)`}
      if(lab._o!==op){lab._o=op;lab.style.opacity=op}
    }
    b.style.transform=`translate3d(${x}px,${y}px,0) scale(${.35+.65*s})`;
    b.style.opacity=e;btnV[i]=e;
    /* обводка: сначала размытая и мягкая, к середине появления собирается в тонкую линию */
    b.style.setProperty('--blur',(1-Math.min(1,g*2)).toFixed(3));
    const on=g>.95;if(on!==btnOn[i]){b.classList.toggle('on',on);btnOn[i]=on}}
  /* дуги дышат и блестят по контуру */
  arcScene.rotation.copy(group.rotation);
  arcScene.scale.copy(group.scale);
  arcScene.position.copy(group.position);
  for(let i=0;i<arcMat.length;i++){const b=arcBase[i];
    arcMat[i].uniforms.uOp.value=b.base*(.7+.5*(.5+.5*Math.sin(T*b.sp+b.ph)))*(1+.8*openV)}
  /* лучи к окнам — рисуем от реальной проекции центра сферы */
  if(Object.keys(openWins).length||edgeDirty||ip.some(g=>g>.02&&g<.985)||ecv._last){
    edgeDirty=false;
    drawEdge(T,cx,cy);
    ecv._last=Object.keys(openWins).length||ip.some(g=>g>.02&&g<.985);
  }
  /* water: render at low res into the history buffer (ping-pong), then upscale to the screen */
  const j=JIT[fc&7];BU.uJit.value.set(j[0],j[1]);BU.uHist.value=rtB.texture;
  renderer.setRenderTarget(rtA);renderer.render(bgScene,camera);renderer.setRenderTarget(null);BU.uReset.value=0;
  SU.t.value=rtA.texture;SU.uT.value=T;const sw=rtA;rtA=rtB;rtB=sw;
  renderer.render(scene,camera);requestAnimationFrame(loop);
}
loop();
