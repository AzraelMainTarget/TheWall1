<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ZT Darkness</title>
<style>
  html, body { margin: 0; height: 100%; background: #020103; overflow: hidden; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #f3e6d0; }
  canvas { display: block; position: fixed; inset: 0; touch-action: none; }
  #title { position: fixed; top: 22px; left: 0; right: 0; text-align: center; letter-spacing: 0.55em; font-size: 13px; color: #ff3e3e; opacity: .85; pointer-events: none; text-shadow: 0 0 16px rgba(255,62,62,.8); z-index: 2; }
  #tip { position: fixed; padding: 6px 14px; border-radius: 12px; background: rgba(15,5,5,.85); border: 1px solid rgba(255,62,62,.45); font-size: 13px; letter-spacing: .08em; pointer-events: none; opacity: 0; transform: translate(-50%, -160%); transition: opacity .25s; white-space: nowrap; backdrop-filter: blur(6px); z-index: 3; }
  #panel { position: fixed; left: 50%; top: 50%; width: min(86vw, 520px); max-height: 70vh; overflow: auto; transform: translate(-50%, -50%) scale(.5); opacity: 0; pointer-events: none; padding: 28px; border-radius: 20px; background: rgba(10,4,4,.9); border: 1px solid rgba(255,62,62,.5); box-shadow: 0 0 80px rgba(255,50,50,.25); backdrop-filter: blur(14px); transition: transform .6s cubic-bezier(.2,.9,.25,1.15), opacity .45s; z-index: 4; }
  #panel.open { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
  #panel h2 { margin: 0 0 12px; font-weight: 500; letter-spacing: .18em; color: #ff4d4d; }
  #panel p { line-height: 1.6; opacity: .9; }
  #close { position: absolute; top: 10px; right: 18px; font-size: 28px; cursor: pointer; color: #ff4d4d; }
  #err { position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 12px 14px; border-radius: 12px; background: rgba(60,10,10,.9); border: 1px solid rgba(255,100,90,.6); color: #ffe6e0; font-size: 13px; display: none; z-index: 10; word-break: break-all; }
</style>
</head>
</audio>id="bg-music" src="PONTE SALVAJE (Slowed).mp3" loop preload="auto"></audio>
<script>
  (() => {
    const audio = document.getElementById('bg-music');
    if (!audio) return;
    const playAudio = () => {
      audio.play().catch(() => {});
      window.removeEventListener('pointerdown', playAudio);
      window.removeEventListener('keydown', playAudio);
    };
    window.addEventListener('pointerdown', playAudio, { once: true });
    window.addEventListener('keydown', playAudio, { once: true });
  })();
</script>

<div id="title">ZT DARKNESS</div>
<div id="tip"></div>
<div id="panel"><div id="close">×</div><h2 id="ph"></h2><div id="pb"></div></div>
<div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
const errBox = document.getElementById('err');
function showErr(msg) {
  errBox.textContent = 'Ошибка загрузки: ' + msg;
  errBox.style.display = 'block';
  console.error(msg);
}
window.addEventListener('error', e => showErr(e.message || e.type));
window.addEventListener('unhandledrejection', e => showErr(e.reason?.message || e.reason || 'неизвестно'));

let THREE;
try {
  THREE = await import('three');
} catch (e1) {
  try {
    THREE = await import('https://esm.sh/three@0.160.0');
  } catch (e2) {
    showErr('Не удалось загрузить 3D библиотеку.');
    throw new Error('Three.js failed to load');
  }
}

const SECTIONS = [
  { name: 'Описание', dir: [0.0, 0.62, 0.78],  html: '<p>ZT Darkness — чистая энергия и динамика.</p>' },
  { name: 'Проекты',  dir: [0.85, -0.1, 0.52],  html: '<p>Архив активных структур.</p>' },
  { name: 'Меню',     dir: [-0.82, 0.2, 0.54],  html: '<p>Системная навигация.</p>' },
  { name: 'Контакты', dir: [0.1, -0.72, 0.69], html: '<p>Точки взаимодействия.</p>' }
];

const isMobile = matchMedia('(pointer: coarse)').matches;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020103, 0.01);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 600);
const CAM_FAR = 17, CAM_NEAR = 11;
camera.position.set(0, 0, CAM_FAR);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock();
const uniforms = { uTime: { value: 0 }, uPix: { value: renderer.getPixelRatio() } };

/* Фон: Сходящийся коридор частиц, летящих на камеру */
const TN = isMobile ? 20000 : 40000, DEPTH = 600;
const tg = new THREE.BufferGeometry();
const tp = new Float32Array(TN * 3), ts = new Float32Array(TN), tr = new Float32Array(TN);
for (let i = 0; i < TN; i++) {
  const theta = Math.random() * Math.PI * 2;
  const radiusSq = Math.random();
  const r = 2 + Math.sqrt(radiusSq) * 140;
  tp[i*3] = Math.cos(theta) * r;
  tp[i*3+1] = Math.sin(theta) * r;
  tp[i*3+2] = -Math.random() * DEPTH;
  ts[i] = 0.5 + Math.random() * 1.5;
  tr[i] = Math.random();
}
tg.setAttribute('position', new THREE.BufferAttribute(tp, 3));
tg.setAttribute('aSize', new THREE.BufferAttribute(ts, 1));
tg.setAttribute('aRnd', new THREE.BufferAttribute(tr, 1));

const tunnelMat = new THREE.ShaderMaterial({
  uniforms: { ...uniforms, uDepth: { value: DEPTH }, uSpeed: { value: 35 } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float aSize; attribute float aRnd;
    uniform float uTime, uPix, uDepth, uSpeed;
    varying float vA; varying float vMix;
    void main(){
      vec3 p = position;
      float zPos = mod(p.z + uTime * uSpeed * (0.8 + aRnd * 0.5), uDepth) - uDepth;
      p.z = zPos;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      float d = -mv.z;
      gl_PointSize = aSize * uPix * (180.0 / max(d, 1.0));
      float fadeFar = smoothstep(uDepth, uDepth * 0.7, d);
      float fadeNear = smoothstep(1.0, 20.0, d);
      vA = fadeFar * fadeNear * (0.3 + aRnd * 0.7);
      vMix = aRnd;
    }`,
  fragmentShader: `
    varying float vA; varying float vMix;
    void main(){
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if(d > 0.5) discard;
      float core = smoothstep(0.5, 0.0, d);
      core = pow(core, 2.0);
      vec3 deepCrimson = vec3(0.5, 0.05, 0.08);
      vec3 brightScarlet = vec3(1.0, 0.15, 0.25);
      vec3 col = mix(deepCrimson, brightScarlet, vMix);
      gl_FragColor = vec4(col, core * vA);
    }`
});
scene.add(new THREE.Points(tg, tunnelMat));

/* Сфера: Живой рой частиц */
const R = 3.2;
const SN = isMobile ? 30000 : 70000;
const sg = new THREE.BufferGeometry();
const sp = new Float32Array(SN * 3), sr = new Float32Array(SN), sz = new Float32Array(SN);
const golden = Math.PI * (3 - Math.sqrt(5));
for (let i = 0; i < SN; i++) {
  const y = 1 - (i / (SN - 1)) * 2, rad = Math.sqrt(1 - y * y), th = golden * i;
  sp[i*3] = Math.cos(th) * rad; sp[i*3+1] = y; sp[i*3+2] = Math.sin(th) * rad;
  sr[i] = Math.random(); sz[i] = 0.5 + Math.random() * 1.0;
}
sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
sg.setAttribute('aRnd', new THREE.BufferAttribute(sr, 1));
sg.setAttribute('aSize', new THREE.BufferAttribute(sz, 1));

const MAXM = 4;
const sUniforms = {
  ...uniforms,
  uR: { value: R },
  uMarks: { value: SECTIONS.map(s => new THREE.Vector3(...s.dir).normalize()) },
  uMarkAmt: { value: [0, 0, 0, 0] }
};

const sphereMat = new THREE.ShaderMaterial({
  uniforms: sUniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float aRnd; attribute float aSize;
    uniform float uTime, uPix, uR;
    uniform vec3 uMarks[${MAXM}]; uniform float uMarkAmt[${MAXM}];
    varying float vA;
    void main(){
      vec3 n = normalize(position);
      float swarm = sin(uTime * 3.0 + aRnd * 31.4) * cos(uTime * 2.5 + n.x * 5.0) * 0.12;
      float pulse = sin(uTime * 1.8 + aRnd * 6.28);
      float len = uR * (1.0 + swarm + 0.02 * pulse);
      float bump = 0.0;
      for (int i = 0; i < ${MAXM}; i++) {
        float md = distance(n, uMarks[i]);
        float m = exp(-md * md * 70.0);
        bump += m * (0.05 + uMarkAmt[i] * 0.35);
      }
      vec3 p = n * (len + bump);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      float d = -mv.z;
      gl_PointSize = aSize * uPix * (60.0 / d) * (1.0 + 0.15 * pulse);
      float rim = pow(1.0 - abs(normalize(mat3(modelViewMatrix) * n).z), 2.0);
      vA = 0.4 + 0.5 * rim + 0.15 * pulse;
    }`,
  fragmentShader: `
    varying float vA;
    void main(){
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if(d > 0.5) discard;
      float core = pow(smoothstep(0.5, 0.0, d), 2.0);
      vec3 col = vec3(0.95, 0.18, 0.28);
      gl_FragColor = vec4(col, core * vA * 1.2);
    }`
});

const sphere = new THREE.Points(sg, sphereMat);
const group = new THREE.Group(); 
group.add(sphere); 
scene.add(group);

const el = renderer.domElement;
let dragging = false, moved = 0, lx = 0, ly = 0, idle = true, idleTimer = 0;
let vyaw = 0, vpitch = 0;
let reach = 0, reachTarget = 0;
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = document.getElementById('tip');
const markAmt = [0, 0, 0, 0], markTarget = [0, 0, 0, 0];
let activeMark = -1;
const panel = document.getElementById('panel');

function toNDC(e) { 
  mouse.x = (e.clientX / innerWidth) * 2 - 1; 
  mouse.y = -(e.clientY / innerHeight) * 2 + 1; 
}
const hitSphere = new THREE.Sphere(new THREE.Vector3(), R);

function pickPoint(e) {
  toNDC(e); 
  ray.setFromCamera(mouse, camera);
  const pt = new THREE.Vector3();
  if (ray.ray.intersectSphere(hitSphere, pt)) {
    group.updateMatrixWorld();
    return pt.applyMatrix4(group.matrixWorld.clone().invert()).normalize();
  }
  return null;
}

function nearestMark(local) {
  let best = -1, bd = 0.35;
  SECTIONS.forEach((s, i) => { 
    const d = local.distanceTo(new THREE.Vector3(...s.dir).normalize()); 
    if (d < bd) { bd = d; best = i; } 
  });
  return best;
}

function onHover(e) {
  const local = pickPoint(e);
  if (local) {
    reachTarget = 1;
    const m = nearestMark(local);
    activeMark = m;
    for (let i = 0; i < MAXM; i++) markTarget[i] = (i === m) ? 1 : 0;
    if (m >= 0) { 
      tip.textContent = SECTIONS[m].name; 
      tip.style.left = e.clientX + 'px'; 
      tip.style.top = e.clientY + 'px'; 
      tip.style.opacity = 1; 
      el.style.cursor = 'pointer'; 
    } else { 
      tip.style.opacity = 0; 
      el.style.cursor = 'grab'; 
    }
  } else {
    reachTarget = dragging ? 1 : 0; activeMark = -1;
    for (let i = 0; i < MAXM; i++) markTarget[i] = 0;
    tip.style.opacity = 0; el.style.cursor = 'grab';
  }
}

el.addEventListener('pointerdown', e => {
  dragging = true; idle = false; moved = 0; lx = e.clientX; ly = e.clientY; clearTimeout(idleTimer);
  el.setPointerCapture(e.pointerId); reachTarget = 1; onHover(e);
});

el.addEventListener('pointermove', e => {
  if (dragging) {
    const dx = e.clientX - lx, dy = e.clientY - ly; 
    lx = e.clientX; ly = e.clientY; 
    moved += Math.abs(dx) + Math.abs(dy);
    vyaw = dx * 0.0035; vpitch = dy * 0.0035;
  }
  onHover(e);
});

el.addEventListener('pointerup', e => {
  dragging = false;
  if (moved < 8 && activeMark >= 0) openPanel(activeMark);
  idleTimer = setTimeout(() => { idle = true; }, 1800);
  if (isMobile) { 
    reachTarget = panel.classList.contains('open') ? 1 : 0; 
    for (let i = 0; i < MAXM; i++) markTarget[i] = 0; 
    tip.style.opacity = 0; 
  }
});

el.addEventListener('pointerleave', () => { 
  if (!dragging) { 
    reachTarget = 0; 
    for (let i = 0; i < MAXM; i++) markTarget[i] = 0; 
    tip.style.opacity = 0; 
  } 
});

function openPanel(i) {
  document.getElementById('ph').textContent = SECTIONS[i].name;
  document.getElementById('pb').innerHTML = SECTIONS[i].html;
  panel.classList.add('open'); tip.style.opacity = 0; reachTarget = 1;
}

document.getElementById('close').onclick = () => { 
  panel.classList.remove('open'); reachTarget = 0; 
};

const lerp = (a, b, t) => a + (b - a) * t;

function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  uniforms.uTime.value += dt;

  if (idle && !panel.classList.contains('open')) group.rotation.y += dt * 0.05;
  group.rotation.y += vyaw; group.rotation.x += vpitch;
  group.rotation.x = Math.max(-1.2, Math.min(1.2, group.rotation.x));
  const damp = dragging ? 0.0 : Math.pow(0.06, dt);
  vyaw *= dragging ? 0.4 : damp; vpitch *= dragging ? 0.4 : damp;

  reach = lerp(reach, reachTarget, 1 - Math.pow(0.001, dt));
  group.position.z = lerp(0, 2.5, reach);
  const zCam = lerp(CAM_FAR, CAM_NEAR, reach);
  camera.position.z = zCam;

  const arr = sUniforms.uMarkAmt.value;
  for (let i = 0; i < MAXM; i++) { 
    markAmt[i] = lerp(markAmt[i], markTarget[i], 1 - Math.pow(0.0008, dt)); 
    arr[i] = markAmt[i]; 
  }

  camera.position.x = lerp(camera.position.x, mouse.x * 0.2, 0.03);
  camera.position.y = lerp(camera.position.y, mouse.y * 0.15, 0.03);
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; 
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPix.value = renderer.getPixelRatio();
});
</script>
</body>
</html>
