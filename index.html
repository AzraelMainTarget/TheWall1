@media (prefers-reduced-motion:reduce){#panel,#hint{transition:none}#icons button::after{animation:none}#pb.a p,#pb.a li{animation:none}}

  /* ---- встроенный Box внутри панели ---- */

  .pbox-head{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:#9a9cb0;margin-bottom:8px;}
  #pbox-feed{max-height:150px;overflow-y:auto;margin-bottom:9px;display:flex;flex-direction:column;gap:6px;}
  #pbox-feed .pm{font-size:12px;line-height:1.4;padding:6px 9px;border-radius:10px;max-width:88%;}
  #pbox-feed .pm.az{margin-left:auto;background:#5c5ed7;color:#fff;}
  #pbox-feed .pm.ar{margin-right:auto;background:#40638b;color:#fff;}
  #pbox-feed .pm .w{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;display:block;margin-bottom:2px;}
  #pbox-feed .empty{font-size:11.5px;color:#8d8fa3;text-align:center;padding:8px;}
  .pbox-row{display:flex;gap:6px;align-items:center;}
  #pbox-msg{flex:1;min-height:38px;padding:9px 11px;border-radius:18px;border:1px solid rgba(255,255,255,.14);
    background:#2b2b37;color:#eef1f7;font-size:14px;font-family:inherit;outline:none;}

<script>
const audio=document.getElementById('bg'),snd=document.getElementById('snd');
let muted=false;try{muted=localStorage.getItem('td-muted')==='1'}catch{}
audio.muted=muted;snd.classList.toggle('m',muted);
snd.onclick=()=>{muted=!muted;audio.muted=muted;snd.classList.toggle('m',muted);try{localStorage.setItem('td-muted',muted?'1':'0')}catch{};if(!muted&&audio.paused)audio.play().catch(()=>{})};
/* browsers only allow sound after a tap: start the music on the first one */
const startAudio=()=>{if(!muted&&audio.paused)audio.play().catch(()=>{})};
['pointerdown','pointerup','touchend','keydown'].forEach(ev=>addEventListener(ev,startAudio,{passive:true}));   // keeps retrying until it actually plays
audio.addEventListener('error',()=>{snd.textContent='✕';snd.title='Music file not found: PONTE SALVAJE (Slowed).mp3'});

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id);
const mobile=matchMedia('(pointer: coarse)').matches,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TS=reduce?.4:1;                              // global animation speed (slower for reduced-motion users)

/* ---------- TUNING (change these) ---------- */
const PORTAL=[.2,.62,.45];                        // portal colour (r,g,b 0..1)
const WATER={clear:1,blend:.4};                    // clear: water translucency strength (0..2) | blend: temporal smoothing (higher = more history)

/* ---------- SECTIONS ---------- */
const ico=d=>`<svg viewBox="0 0 32 32">${d}</svg>`;
const SECTIONS=[
 {name:'Categories',svg:ico('<circle cx="9.5" cy="9.5" r="4"/><circle cx="22.5" cy="9.5" r="4"/><circle cx="9.5" cy="22.5" r="4"/><circle cx="22.5" cy="22.5" r="4"/><circle cx="16" cy="16" r=".8" fill="currentColor"/>'),
  html:'<p>Every build, grouped by what it does for your business.</p><ul><li>Automation<small>Workflows that run without you.</small></li><li>AI tools<small>Assistants, generators, agents.</small></li><li>Startup kits<small>Ready to launch ideas.</small></li></ul>'},
 {name:'Products',svg:ico('<path d="M16 3.5l11 6.2v12.6L16 28.5 5 22.3V9.7z"/><path d="M5 9.7l11 6.3 11-6.3M16 16v12.5"/><circle cx="27.5" cy="4" r=".8" fill="currentColor"/>'),
  html:'<p>Finished products and prototypes, listed as they ship.</p><ul><li>Coming soon<small>Add your first product here.</small></li></ul>'},
 {name:'Ready Solutions',svg:ico('<path d="M18 3L7 18h8l-1.5 11L25 14h-8z"/><circle cx="26" cy="6" r=".9" fill="currentColor"/><circle cx="5" cy="25" r=".9" fill="currentColor"/>'),
  html:'<p>Plug-in solutions you can deploy today, with setup included.</p><ul><li>Coming soon<small>Add your first solution here.</small></li></ul>'},
 {name:'Contacts',svg:ico('<path d="M4 14.5L28 4l-7 24-5.5-9.5z"/><path d="M15.5 18.5L28 4"/>'),
  html:'<p>Partnerships, questions, and custom builds.</p><ul><li>Email<small>your@email.com</small></li><li>Telegram<small>@yourhandle</small></li></ul>'},
 {name:'Support the Project',svg:ico('<path d="M16 28S4 20 4 12a6 6 0 0 1 12-2 6 6 0 0 1 12 2c0 8-12 16-12 16z"/><circle cx="16" cy="4.5" r=".8" fill="currentColor"/>'),
  html:'<p>Help keep these tools free and growing.</p><ul><li>Donate<small>Add your link here.</small></li><li>Share<small>Tell another founder.</small></li></ul>'},
 {name:'Box',svg:ico('<path d="M4 9.5h24M4 9.5v13.5a2.5 2.5 0 0 0 2.5 2.5h19a2.5 2.5 0 0 0 2.5-2.5V9.5"/><path d="M11 9.5V7a5 5 0 0 1 10 0v2.5"/><circle cx="16" cy="17" r="1.4" fill="currentColor"/>'),
  html:'', box:true}
];
const winsRoot=$('windows'), winTpl=$('win-tpl'), hint=$('hint');

/* ---------- ПАРОЛЬ ---------- */
const SECTION_PASS='maintarget1488';
const PASS_KEY='td-unlocked';       // набор открытых разделов в sessionStorage
function unlocked(){
  try{return new Set(JSON.parse(sessionStorage.getItem(PASS_KEY)||'[]'))}catch{return new Set()}
}
function markUnlocked(name){
  const u=unlocked();u.add(name);
  try{sessionStorage.setItem(PASS_KEY,JSON.stringify([...u]))}catch{}
}
function isUnlocked(name){return unlocked().has(name)}

/* ---------- ОКНА ---------- */
let zTop=10, winCount=0;
const openWins={};

function makeDraggable(win, bar){
  let sx=0,sy=0,ox=0,oy=0,dragging=false;
  const onDown=(e)=>{
    if(e.target.closest('[data-close]'))return;
    dragging=true;
    win.classList.add('drag');
    const r=win.getBoundingClientRect();
    win.style.left=r.left+'px'; win.style.top=r.top+'px';
    win.style.bottom='auto'; win.style.right='auto';
    const p=e.touches?e.touches[0]:e;
    sx=p.clientX; sy=p.clientY; ox=r.left; oy=r.top;
    bringFront(win);
    e.preventDefault();
  };
  const onMove=(e)=>{
    if(!dragging)return;
    const p=e.touches?e.touches[0]:e;
    let nx=ox+(p.clientX-sx), ny=oy+(p.clientY-sy);
    const w=win.offsetWidth, h=win.offsetHeight;
    nx=Math.max(6,Math.min(innerWidth-w-6,nx));
    ny=Math.max(6,Math.min(innerHeight-h-6,ny));
    win.style.left=nx+'px'; win.style.top=ny+'px';
    e.preventDefault();
  };
  const onUp=()=>{ if(dragging){dragging=false;win.classList.remove('drag')} };
  bar.addEventListener('pointerdown',onDown);
  addEventListener('pointermove',onMove,{passive:false});
  addEventListener('pointerup',onUp);
  addEventListener('pointercancel',onUp);
}

function bringFront(win){ win.style.zIndex=String(++zTop); }

function closeWin(name){
  const w=openWins[name]; if(!w)return;
  w.classList.remove('open');
  setTimeout(()=>{ w.remove(); delete openWins[name]; },380);
}

function addWin(name, buildBody){
  if(openWins[name]){ bringFront(openWins[name]); return openWins[name]; }
  const node=winTpl.content.firstElementChild.cloneNode(true);
  node.querySelector('.win-title').textContent=name;
  const body=node.querySelector('.win-body');
  buildBody(body);
  node.querySelector('[data-close]').onclick=()=>closeWin(name);
  node.addEventListener('pointerdown',()=>bringFront(node));
  /* каскад, чтобы окна не ложились друг на друга */
  const n=Object.keys(openWins).length;
  const w=Math.min(innerWidth*0.88,360);
  node.style.left=Math.max(10,Math.min(innerWidth-w-10, (innerWidth-w)/2 + (n%3-1)*28))+'px';
  node.style.top=Math.max(70, 90 + n*34)+'px';
  winsRoot.appendChild(node);
  openWins[name]=node;
  makeDraggable(node, node.querySelector('.win-bar'));
  requestAnimationFrame(()=>node.classList.add('open'));
  bringFront(node);
  return node;
}

/* окно с замком */
function lockWin(name, html){
  addWin(name,(body)=>{
    body.innerHTML=`<div class="win-lock">
        <div class="ico">🔒</div>
        <p style="text-align:center;margin:0;color:#b9d2c6">Раздел закрыт. Введите пароль.</p>
        <input type="password" inputmode="text" autocomplete="off" autocapitalize="off"
               spellcheck="false" autofocus placeholder="Пароль">
        <div class="msg"></div>
        <button type="button">Открыть</button>
        <div class="hint">закрытый раздел</div>
      </div>`;
    const inp=body.querySelector('input'), msg=body.querySelector('.msg'), btn=body.querySelector('button');
    const tryOpen=()=>{
      const v=inp.value.trim();
      if(v.toLowerCase()===SECTION_PASS){
        markUnlocked(name);
        body.innerHTML=html;   /* содержимое раздела */
        body.classList.remove('locked');
      } else {
        msg.textContent='неверный пароль';
        inp.value=''; inp.focus();
        body.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},
                      {transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:220});
      }
    };
    btn.onclick=tryOpen;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')tryOpen()});
  });
}

function openSec(i){
  const s=SECTIONS[i];
  if(s.box){ openBoxWindow(); hint.style.opacity=0; return; }
  if(!isUnlocked(s.name)){ lockWin(s.name, '<h2>'+s.name+'</h2>'+s.html); }
  else { addWin(s.name,(body)=>{ body.innerHTML='<h2>'+s.name+'</h2>'+s.html; }); }
  hint.style.opacity=0;
}

function openBoxWindow(){
  addWin('Box',(body)=>{
    body.innerHTML='<div id="pbox-feed"></div>'
      +'<div class="pbox-row" style="display:flex;gap:6px;margin-top:10px">'
      +'<button type="button" id="pbox-rec" style="width:42px;height:38px;border-radius:14px;border:none;background:#457a66;color:#fff;font-size:15px;cursor:pointer">●</button>'
      +'<input id="pbox-msg" placeholder="Сообщение…" style="flex:1;min-height:38px;padding:9px 11px;border-radius:14px;border:1px solid rgba(120,200,165,.26);background:rgba(0,0,0,.35);color:#e8f5ee;font-size:14px;font-family:inherit;outline:none">'
      +'<button type="button" id="pbox-send" style="width:42px;height:38px;border-radius:14px;border:none;background:rgba(255,255,255,.08);color:#e8f5ee;font-size:15px;cursor:pointer">↑</button>'
      +'</div>';
    if(window.PORTAL_BOX) PORTAL_BOX.mount(body);
  });
  hint.style.opacity=0;
}

addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  const wins=[...document.querySelectorAll('.win.open')];
  if(wins.length) wins[wins.length-1].querySelector('[data-close]')?.click();
});

/* icon buttons */
const iconBox=$('icons');
let hoverI=-1;
const btns=SECTIONS.map((s,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML=s.svg+`<span>${s.name}</span>`;b.setAttribute('aria-label',s.name);b.onclick=()=>openSec(i);b.onpointerenter=()=>{hoverI=i};b.onpointerleave=()=>{hoverI=-1};iconBox.appendChild(b);return b});

/* ---------- SCENE ---------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:false,stencil:false,depth:false,powerPreference:'high-performance'});
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
renderer.autoClear=false;                           // every frame is fully overdrawn by the background pass
