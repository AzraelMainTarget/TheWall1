<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#010104">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Box">
<link rel="manifest" href="box.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Box</title>
<style>
  :root{
    /* цвета взяты пипеткой с присланного фото */
    --bg:#3c3b4d; --bg-deep:#33323f;
    --global:#2b2b37; --hr:#457a66; --dev:#40638b; --count:#3e4055; --bot:#5c5ed7; --guest:#c163b9;
    --ink:#eef1f7; --dim:#a4a6b8; --line:rgba(255,255,255,.10); --accent:#dfe3ee;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;}

  /* каркас на весь экран: шапка, лента, композер */
  .app{display:flex;flex-direction:column;height:100dvh;max-width:600px;margin:0 auto;
    background:var(--bg);}

  /* лёгкая текстура как на фото: мягкие пятна, без шума */
  .app::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(60% 40% at 50% 15%, rgba(255,255,255,.035), transparent 70%),
      radial-gradient(80% 50% at 50% 100%, rgba(0,0,0,.28), transparent 70%);
    z-index:0;}
  header, #tracker, #feed, .compwrap, details{position:relative;z-index:1;}

  header{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;border-bottom:1px solid var(--line);flex:0 0 auto;}
  header h1{font-size:12px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;
    color:var(--ink);margin:0;}
  header .r{display:flex;gap:6px;align-items:center;}
  header button{background:var(--global);border:1px solid var(--line);color:var(--dim);border-radius:9px;
    font-family:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:6px 9px;cursor:pointer;}
  header button:active{transform:translateY(1px);}
  #ver{font-size:9px;color:#3c4a5d;letter-spacing:.1em;}

  /* лента */
  #tracker{flex:0 0 auto;height:18px;padding:4px 14px 0;font-size:9.5px;letter-spacing:.14em;
    text-transform:uppercase;color:#4d5f76;transition:color .3s;}
  #tracker.act{color:var(--guest);}
  #tracker .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;
    margin-right:6px;animation:blink 1.1s infinite;}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  #feed{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 6px;
    scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent;}
  #feed::-webkit-scrollbar{width:5px;}
  #feed::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px;}
  .m{max-width:86%;margin-bottom:10px;padding:10px 13px;border-radius:16px;font-size:15px;font-weight:600;line-height:1.5;
    word-break:break-word;position:relative;letter-spacing:.006em;-webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;}
  .m .who{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:9px;font-weight:900;
    letter-spacing:.15em;text-transform:uppercase;display:block;margin-bottom:4px;}
  .m .when{font-size:9px;opacity:.72;margin-left:6px;font-variant-numeric:tabular-nums;}
  /* Azrael — Bot (индиго) с фото, Arena — Dev (синий) с фото */
  /* Azrael — тёплый шёлк, ник чёрный как смерть; Arena — глубокая ночь с золотом */
  .m.az{margin-left:auto;background:linear-gradient(158deg,#FEC968,#FEB342 55%,#F2A22B);
    border:1px solid rgba(255,226,176,.8);border-bottom-right-radius:6px;
    color:#231000;font-weight:700;text-shadow:0 1px 0 rgba(255,236,196,.45);
    box-shadow:0 0 18px rgba(254,179,66,.42),0 8px 22px rgba(0,0,0,.42);}
  .m.arena{margin-right:auto;background:linear-gradient(158deg,#F58A2A,#F16F0D 58%,#D95D05);
    border:1px solid rgba(255,206,150,.66);border-bottom-left-radius:6px;
    color:#FFF6EC;font-weight:700;text-shadow:0 1px 0 rgba(74,26,0,.55);
    box-shadow:0 0 18px rgba(241,111,13,.45),0 0 34px rgba(254,179,66,.22),0 8px 22px rgba(0,0,0,.45);}
  .m.az .who{color:#0E4D55;text-shadow:0 1px 0 rgba(255,244,220,.75),0 0 8px rgba(20,123,120,.35);}
  .m.arena .who{color:#F0F0EA;text-shadow:0 1px 0 rgba(90,34,0,.8),0 0 10px rgba(14,77,85,.55);}
  .m.pending{opacity:.62;}
  /* галочки доставки */
  .hand{display:inline-block;margin-left:6px;font-size:12px;line-height:1;vertical-align:baseline;
    color:#0E4D55;opacity:.9;filter:drop-shadow(0 1px 1px rgba(0,0,0,.55));
    transition:opacity .25s,transform .25s;}
  .hand.read{opacity:1;transform:scale(1.12);}
  .m audio{width:100%;min-width:190px;margin-top:5px;height:34px;}
  .m a{color:#3A1A00;text-decoration:underline;}
  .m.arena .hand{color:#F0F0EA;}
  .m.arena a{color:#EAF7F3;text-decoration-color:rgba(255,255,255,.6);}
  .empty{text-align:center;color:#4a5b70;font-size:12px;padding:30px 10px;}

  /* композер */
  .comp{flex:0 0 auto;border-top:1px solid var(--line);padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);
    display:flex;gap:8px;align-items:flex-end;}
  .comp textarea{flex:1;min-height:40px;max-height:110px;padding:10px 12px;border-radius:20px;
    border:1px solid var(--line);background:var(--global);color:var(--ink);font-size:15px;
    font-family:inherit;outline:none;resize:none;}
  .comp textarea:focus{border-color:rgba(200,230,255,.45);}
  .fab{width:52px;height:40px;border-radius:20px;border:1px solid var(--line);
    background:var(--global);color:var(--ink);font-size:17px;cursor:pointer;flex:0 0 auto;}
  .fab.rec{background:var(--hr);color:#fff;border-color:transparent;font-weight:700;}
  .fab.rec.on{background:var(--guest);color:#fff;animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  #st{display:none;}
  .compwrap{position:relative;}
  details{flex:0 0 auto;border-top:1px solid var(--line);padding:8px 12px;font-size:11px;color:var(--dim);}
  details input{width:100%;margin-top:7px;padding:9px;border-radius:9px;border:1px solid var(--line);
    background:var(--global);color:var(--ink);font-size:13px;outline:none;}
  details button{margin-top:7px;width:100%;padding:9px;border-radius:9px;border:1px solid var(--line);
    background:var(--count);color:var(--ink);font-family:inherit;font-size:12px;}
</style>
<script src="guard.js?v=1"></script>
</head>
<body>
<div class="app">
  <header>
    <h1>Box</h1>
    <div class="r">
      <span id="ver">b12</span>
      <button id="reload">↻</button>
    </div>
  </header>

  <div id="tracker">тишина</div>

  <div id="feed"><div class="empty">загружаю…</div></div>

  <div class="compwrap">
    <div id="st"></div>
    <div class="comp">
      <button class="fab rec" id="rec" title="Записать">●</button>
      <textarea id="msg" rows="1" placeholder="Сообщение…"></textarea>
      <button class="fab" id="send" title="Отправить">↑</button>
    </div>
  </div>

  <details>
    <summary>Ключ GitHub</summary>
    <input id="tok" type="password" placeholder="github_pat_..." autocomplete="off" spellcheck="false">
    <button id="saveTok">Сохранить</button>
  </details>
</div>
<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
<script src="box.js?v=13"></script>
<script src="credits.js"></script>
</body>
</html>
