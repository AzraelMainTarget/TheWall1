<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#010104">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Box</title>
<style>
  :root{--ink:#e8f1ff;--dim:#7d90ab;--line:rgba(150,190,255,.14);--accent:#cfe6ff;--bg:#010104;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;}

  /* каркас на весь экран: шапка, лента, композер */
  .app{display:flex;flex-direction:column;height:100dvh;max-width:600px;margin:0 auto;
    background:radial-gradient(130% 75% at 50% 0%,#070a11 0%,#03050a 55%,#000 100%);}

  header{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;border-bottom:1px solid var(--line);flex:0 0 auto;}
  header h1{font-size:11.5px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;
    color:var(--accent);margin:0;text-shadow:0 0 24px rgba(150,200,255,.45);}
  header .r{display:flex;gap:6px;align-items:center;}
  header button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:9px;
    font-family:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:6px 9px;cursor:pointer;}
  header button:active{transform:translateY(1px);}
  #ver{font-size:9px;color:#3c4a5d;letter-spacing:.1em;}

  /* лента */
  #tracker{flex:0 0 auto;height:18px;padding:4px 14px 0;font-size:9.5px;letter-spacing:.14em;
    text-transform:uppercase;color:#4d5f76;transition:color .3s;}
  #tracker.act{color:#6aa8d8;}
  #tracker .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;
    margin-right:6px;animation:blink 1.1s infinite;}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  #feed{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 12px 6px;}
  .m{max-width:86%;margin-bottom:9px;padding:8px 11px;border-radius:14px;font-size:14px;line-height:1.42;
    word-break:break-word;position:relative;}
  .m .who{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:9px;font-weight:800;
    letter-spacing:.13em;text-transform:uppercase;display:block;margin-bottom:3px;opacity:.85;}
  .m .when{font-size:9px;opacity:.5;margin-left:6px;font-variant-numeric:tabular-nums;}
  /* Azrael — тёплый камень, Arena — холодная сталь. Никакого коричневого */
  .m.az{margin-left:auto;background:rgba(196,204,214,.075);border:1px solid rgba(196,204,214,.14);
    border-bottom-right-radius:5px;color:#e6ecf3;}
  .m.az .who{color:#b9c6d4;}
  .m.arena{margin-right:auto;background:rgba(96,148,204,.085);border:1px solid rgba(110,165,220,.18);
    border-bottom-left-radius:5px;color:#e2edf8;}
  .m.arena .who{color:#82b6e0;}
  .m.pending{opacity:.62;}
  /* галочки доставки */
  .hand{display:inline-block;margin-left:6px;font-size:12px;line-height:1;vertical-align:baseline;
    opacity:.55;transition:opacity .25s,transform .25s;}
  .hand.read{opacity:1;transform:scale(1.08);}
  .m audio{width:100%;min-width:190px;margin-top:5px;height:34px;}
  .m a{color:#a9c8ee;}
  .empty{text-align:center;color:#4a5b70;font-size:12px;padding:30px 10px;}

  /* композер */
  .comp{flex:0 0 auto;border-top:1px solid var(--line);padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);
    display:flex;gap:8px;align-items:flex-end;}
  .comp textarea{flex:1;min-height:40px;max-height:110px;padding:10px 12px;border-radius:20px;
    border:1px solid var(--line);background:rgba(8,14,26,.95);color:var(--ink);font-size:15px;
    font-family:inherit;outline:none;resize:none;}
  .comp textarea:focus{border-color:rgba(200,230,255,.45);}
  .fab{width:52px;height:40px;border-radius:20px;border:1px solid var(--line);
    background:rgba(12,20,34,.95);color:var(--ink);font-size:17px;cursor:pointer;flex:0 0 auto;}
  .fab.rec{background:rgba(190,220,255,.92);color:#06101f;border-color:transparent;font-weight:700;}
  .fab.rec.on{background:rgba(200,40,35,.9);color:#fff;animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  #st{display:none;}
  .compwrap{position:relative;}
  details{flex:0 0 auto;border-top:1px solid var(--line);padding:8px 12px;font-size:11px;color:var(--dim);}
  details input{width:100%;margin-top:7px;padding:9px;border-radius:9px;border:1px solid var(--line);
    background:rgba(6,11,20,.95);color:var(--ink);font-size:13px;outline:none;}
  details button{margin-top:7px;width:100%;padding:9px;border-radius:9px;border:1px solid var(--line);
    background:rgba(12,20,34,.9);color:var(--ink);font-family:inherit;font-size:12px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Box</h1>
    <div class="r">
      <span id="ver">b10</span>
      <button id="reload">↻</button>
    </div>
  </header>

  <div id="tracker">тишина</div>

  <div id="feed"><div class="empty">загружаю…</div></div>

  <div class="compwrap">
    <div id="st"></div>
    <div class="comp">
      <button class="fab rec" id="rec" title="Записать">●</button>
      <textarea id="msg" rows="1" placeholder="Сообщение…"></textarea>
      <button class="fab" id="send" title="Отправить">↑</button>
    </div>
  </div>

  <details>
    <summary>Ключ GitHub</summary>
    <input id="tok" type="password" placeholder="github_pat_..." autocomplete="off" spellcheck="false">
    <button id="saveTok">Сохранить</button>
  </details>
</div>
<script src="box.js?v=10"></script>
</body>
</html>
