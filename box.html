<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010104">
<meta name="robots" content="noindex, nofollow">
<title>Box — обмен</title>
<style>
  :root{--ink:#e8f1ff;--dim:#7d90ab;--line:rgba(150,190,255,.16);--accent:#cfe6ff;--ok:#7ee0a8;--bad:#ff9f96;}
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:radial-gradient(130% 90% at 50% 0%,#0a111d,#010104 58%);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;}
  .wrap{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));}
  h1{font-size:13px;font-weight:300;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin:6px 0 4px;text-shadow:0 0 30px rgba(150,200,255,.4);}
  .sub{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:0 0 18px;}
  .card{border:1px solid var(--line);border-radius:16px;background:rgba(10,17,29,.78);padding:14px;margin-bottom:12px;}
  textarea,input.f{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);
    background:rgba(6,11,20,.92);color:var(--ink);font-size:15px;font-family:inherit;outline:none;}
  textarea{min-height:74px;resize:vertical;}
  textarea:focus,input.f:focus{border-color:rgba(200,230,255,.5);}
  .row{display:flex;gap:9px;margin-top:10px;flex-wrap:wrap;}
  .btn{flex:1 1 100px;min-height:46px;border-radius:12px;border:1px solid var(--line);
    background:rgba(12,20,34,.9);color:var(--ink);font-family:inherit;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:linear-gradient(180deg,rgba(190,220,255,.96),rgba(140,180,240,.92));color:#06101f;border-color:transparent;font-weight:600;}
  .btn.rec.on{background:rgba(60,18,18,.85);border-color:rgba(255,120,110,.55);}
  .btn.wide{width:100%;min-height:56px;font-size:14px;letter-spacing:.04em;}
  .status{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);min-height:15px;margin-top:10px;}
  h2{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:400;margin:22px 0 10px;}
  .item{padding:11px 0;border-bottom:1px solid rgba(150,190,255,.09);font-size:13.5px;line-height:1.5;}
  .item:last-child{border-bottom:none;}
  .item .t{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#4d5f76;display:block;margin-bottom:3px;}
  .item .meta{display:flex;align-items:baseline;gap:10px;margin-bottom:5px;}
  .item .meta b.who{
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  }
  .item .when{font-size:10.5px;letter-spacing:.1em;color:#5b6e86;font-variant-numeric:tabular-nums;}
  .item .body{display:block;color:#e4eefb;font-size:14.5px;line-height:1.55;word-break:break-word;}
  /* Arena — голубая полоса слева, Ты — оранжевая */
  .from-arena{border-left:3px solid #4fa8e8; padding-left:11px;}
  .from-me{border-left:3px solid #e8a24f; padding-left:11px;}
  .from-arena .who{color:#7cc4f5;}
  .from-me .who{color:#f5c27c;}
  .item a{color:#a9c8ee;word-break:break-all;}
  .item audio{width:100%;margin-top:6px;height:34px;}
  details{margin-top:20px;}
  summary{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#485768;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Box</h1>
  <p class="sub">ссылки и голос · <span id="ver">build 6</span></p>

  <div class="card">
    <textarea id="msg" placeholder="Ссылка или сообщение…"></textarea>
    <div class="row">
      <button class="btn primary" id="sendMsg">Отправить</button>
    </div>
    <button class="btn rec wide" id="rec">● Записать · отправится само</button>
    <div class="status" id="st">готово</div>
  </div>

  <h2>Лента</h2>
  <div class="card" id="feed"><div class="item"><span class="t">—</span>пусто</div></div>
  <div class="row"><button class="btn" id="reload">Обновить</button></div>

  <details>
    <summary>Ключ GitHub</summary>
    <input class="f" id="tok" type="password" placeholder="github_pat_..." autocomplete="off" spellcheck="false" style="margin-top:10px">
    <div class="row"><button class="btn" id="saveTok">Сохранить</button></div>
  </details>
</div>

<script src="box.js?v=6"></script>
</body>
</html>
