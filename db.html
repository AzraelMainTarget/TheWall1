<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>База — That Darkness</title>
<style>
  :root{--bg:#3c3b4d;--global:#2b2b37;--hr:#457a66;--dev:#40638b;--bot:#5c5ed7;--guest:#c163b9;
    --ink:#eef1f7;--dim:#a4a6b8;--line:rgba(255,255,255,.1);}
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;}
  .w{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 30px;}
  h1{font-size:12px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;margin:6px 0 4px;}
  .sub{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:0 0 22px;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .card{border-radius:14px;padding:14px;background:var(--global);border:1px solid var(--line);}
  .card .n{font-size:26px;font-weight:700;line-height:1;}
  .card .l{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:6px;}
  .c1 .n{color:var(--dev);} .c2 .n{color:var(--bot);} .c3 .n{color:var(--hr);} .c4 .n{color:var(--guest);}
  h2{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:26px 0 10px;font-weight:400;}
  .item{background:var(--global);border:1px solid var(--line);border-radius:12px;padding:11px 13px;
    margin-bottom:7px;font-size:13px;display:flex;gap:9px;align-items:baseline;}
  .item .t{font-size:9px;color:var(--dim);letter-spacing:.1em;min-width:62px;}
  .item .who{font-family:"SF Mono",Menlo,monospace;font-size:10px;font-weight:700;letter-spacing:.08em;}
  .az{color:#9a9cf0;} .ar{color:#7fb0dd;}
  .task{display:flex;gap:9px;align-items:baseline;}
  .task .id{font-family:"SF Mono",Menlo,monospace;font-size:10px;color:var(--dim);}
  .empty{color:var(--dim);font-size:12.5px;padding:10px 0;}
</style>
<script src="guard.js?v=1"></script>
</head>
<body>
<div class="w">
  <h1>База проекта</h1>
  <p class="sub" id="built">загружаю…</p>

  <div class="cards">
    <div class="card c1"><div class="n" id="msgs">—</div><div class="l">сообщений</div></div>
    <div class="card c2"><div class="n" id="voice">—</div><div class="l">голосовых</div></div>
    <div class="card c3"><div class="n" id="unread">—</div><div class="l">не прочитано</div></div>
    <div class="card c4"><div class="n" id="tasks">—</div><div class="l">задач открыто</div></div>
  </div>

  <h2>Последние сообщения</h2>
  <div id="feed" class="empty">…</div>

  <h2>Задачи</h2>
  <div id="tasklist" class="empty">…</div>
</div>
<script>
fetch('db.json?t=' + Date.now()).then(r => r.json()).then(d => {
  document.getElementById('built').textContent = 'обновлено ' + d.built.replace('T', ' ');
  document.getElementById('msgs').textContent = d.counts.messages;
  document.getElementById('voice').textContent = d.counts.voice;
  document.getElementById('unread').textContent = d.counts.unread;
  document.getElementById('tasks').textContent = d.tasks.filter(t => t.status === 'todo').length;

  const feed = d.messages.slice(-10).reverse();
  document.getElementById('feed').innerHTML = feed.length ? feed.map(m => {
    const az = m.who === 'Azrael';
    const body = m.kind === 'voice' ? '🎤 голосовое' : m.text.slice(0, 80);
    return '<div class="item"><span class="t">' + m.date.slice(5) + ' ' + m.time + '</span>' +
      '<span class="who ' + (az ? 'az' : 'ar') + '">' + m.who + '</span>' +
      '<span>' + body + '</span></div>';
  }).join('') : '<div class="empty">пусто</div>';

  document.getElementById('tasklist').innerHTML = d.tasks.map(t =>
    '<div class="item task"><span class="id">' + t.id + '</span>' +
    '<span>' + (t.status === 'todo' ? '☐' : '☑') + ' ' + t.title + '</span></div>').join('');
}).catch(e => {
  document.getElementById('built').textContent = 'ошибка: ' + e.message;
});
</script>
<script src="credits.js"></script>
</body>
</html>
